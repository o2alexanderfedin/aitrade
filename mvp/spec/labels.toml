# Label catalogue source of truth (SPEC-01, SPEC-02).
#
# Every label must have an entry here before being used. A definition (computation)
# change gets a NEW name (see mvp/spec.md Label catalogue Rules);
# mvp/tools/check_spec_diff.py CI-rejects a changed `computation` under an existing
# name.
#
# Rendered into mvp/spec.md between the `<!-- catalogue:labels:begin -->` /
# `:end` markers by `mvp/spec/render.py` -- keep table-declaration order meaningful:
# rows render in this file's declaration order (primary label first), not sorted.
#
# `information_set` and `notes` were pinned to what the code computes by Phase 4
# Plan 04 (D-04-05's as-of rule, null rules and day-boundary rule; D-04-17's
# measured quantization) and updated 2026-09-19 for the fourth null reason
# (null_stale, 04-REVIEW.md WR-02). Every `computation` string is byte-unchanged from the
# day it was declared: check_spec_diff compares `computation` only, and a
# redefinition is supposed to get a NEW name, so the convention, the three null
# cases and the measured numbers live in `information_set`/`notes` deliberately.

[ret_10s_mid]
horizon = "10s"
computation = "(mid_{t+10s} - mid_t) / mid_t"
information_set = "data through t + 10s for the VALUE; the quote ARRIVAL TIMES through t + 10s + label_gap.max_quote_gap_seconds additionally decide whether the label exists (a gap that long overlapping [t, t+10s] nulls it, and so does the absence of ANY arrival in (t, t+10s]) -- that direction can only REMOVE a label, never change a finite one"
embargo = ">= 10s"
notes = "Primary trading target. mid_{t+h} is the PREVAILING mid -- the last L1 update with etime <= t+h (backward as-of, exact matches allowed; on a tie group the LAST update of that etime) -- never the first update after t+h. The next-quote convention disagrees on 0.206% of DECISION ROWS at h=10s (0.263% per L1 update; correlation 0.999907, measured 2026-09-13) and that delta is reported in the feature-tier DQ row (feature_asof_convention), not stored as a second column: an uncatalogued label column would break this catalogue's own rule. NULL -- never 0, never a carried-forward price -- when the horizon window ends past available data, spans an L1 gap longer than dq_thresholds.label_gap.max_quote_gap_seconds, has no mid_t, or -- null_stale, added 2026-09-19 -- had NO quote arrive in (t, t+h] at all, so the prevailing mid at t+h is the very quote that produced mid_t. THE STALENESS BOUND IS THE HORIZON, not a configured number (04-REVIEW.md WR-02): one absolute 30 s threshold is 3x this catalogue's primary horizon and 30x ret_1s_mid's, so any silence under it used to difference a carried-forward price against itself and report exactly 0.0 -- finite, unflagged, and indistinguishable from a real 'the market did not move'. A per-horizon absolute threshold was rejected for over-nulling the other way: a 5 s silence ending half a second inside a 1 s window leaves a genuine quote in that window. MEASURED on all three built days (22.29M decision rows): the rule nulls 69 primary labels (2026-09-12) and 180 ret_1s_mid (153 on 09-12, 27 on 09-13), 0 at 1 min and 0 at 10 min, and EVERY one of them was exactly 0.0 before. The measured statistics below are therefore unchanged to six significant figures (09-13 ret_10s_mid zero fraction moves by 0, ret_1s_mid by -7.6e-07); the existing partitions were NOT rewritten -- a rebuild under a new manifest is Phase 5's call. Null-labelled rows are excluded from training by construction. Day D is built only once day D+1's curated manifest exists, so D's tail reads D+1's quotes and the most recent day is never built (partitions are write-once; a null tail could not be repointed). EVERY NUMBER BELOW IS PER DECISION ROW -- the row this label is actually written on. 04-RESEARCH-NOTES.md measured the same day per L1 UPDATE, a row set that oversamples busy milliseconds (2.5 quotes per distinct etime), so its returns have a higher std and fewer exact zeros; both are given because the research numbers are quoted elsewhere and the difference is large. Measured 2026-09-13 over 6,864,853 decision rows: std 1.447e-04, EXACTLY ZERO ON 43.9% OF ROWS (per L1 update: 1.853e-04 and 29.7%) -- D-04-17, a property of a venue where 97.5% of quotes sit at a 1-tick spread, NOT a defect, and not smoothed away here: Phase 5/8 must choose the loss function and every IC/Sharpe statistic knowing the target has a ~44% point mass at zero. End-of-partition coverage loss without the D+1 tail is 507 rows (0.0074%; 1,086 = 0.0063% per L1 update), and 0 with it. Embargo >= 10s, asserted in CI (FEAT-04)."
version = 1
introduced = "2026-09-13"

