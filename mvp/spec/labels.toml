# Label catalogue source of truth (SPEC-01, SPEC-02).
#
# Every label must have an entry here before being used. A definition (computation)
# change gets a NEW name (see mvp/spec.md Label catalogue Rules);
# mvp/tools/check_spec_diff.py CI-rejects a changed `computation` under an existing
# name.
#
# Rendered into mvp/spec.md between the `<!-- catalogue:labels:begin -->` /
# `:end` markers by `mvp/spec/render.py` -- keep table-declaration order meaningful:
# rows render in this file's declaration order (primary label first), not sorted.
#
# `information_set` and `notes` were pinned to what the code computes by Phase 4
# Plan 04 (D-04-05's as-of rule, null rules and day-boundary rule; D-04-17's
# measured quantization). Every `computation` string is byte-unchanged from the
# day it was declared: check_spec_diff compares `computation` only, and a
# redefinition is supposed to get a NEW name, so the convention, the three null
# cases and the measured numbers live in `information_set`/`notes` deliberately.

[ret_10s_mid]
horizon = "10s"
computation = "(mid_{t+10s} - mid_t) / mid_t"
information_set = "data through t + 10s for the VALUE; the quote ARRIVAL TIMES through t + 10s + label_gap.max_quote_gap_seconds additionally decide whether the label exists (a gap that long overlapping [t, t+10s] nulls it) -- that direction can only REMOVE a label, never change a finite one"
embargo = ">= 10s"
notes = "Primary trading target. mid_{t+h} is the PREVAILING mid -- the last L1 update with etime <= t+h (backward as-of, exact matches allowed; on a tie group the LAST update of that etime) -- never the first update after t+h. The next-quote convention disagrees on 0.206% of DECISION ROWS at h=10s (0.263% per L1 update; correlation 0.999907, measured 2026-09-13) and that delta is reported in the feature-tier DQ row (feature_asof_convention), not stored as a second column: an uncatalogued label column would break this catalogue's own rule. NULL -- never 0, never a carried-forward price -- when the horizon window ends past available data, spans an L1 gap longer than dq_thresholds.label_gap.max_quote_gap_seconds, or has no mid_t. Null-labelled rows are excluded from training by construction. Day D is built only once day D+1's curated manifest exists, so D's tail reads D+1's quotes and the most recent day is never built (partitions are write-once; a null tail could not be repointed). EVERY NUMBER BELOW IS PER DECISION ROW -- the row this label is actually written on. 04-RESEARCH-NOTES.md measured the same day per L1 UPDATE, a row set that oversamples busy milliseconds (2.5 quotes per distinct etime), so its returns have a higher std and fewer exact zeros; both are given because the research numbers are quoted elsewhere and the difference is large. Measured 2026-09-13 over 6,864,853 decision rows: std 1.447e-04, EXACTLY ZERO ON 43.9% OF ROWS (per L1 update: 1.853e-04 and 29.7%) -- D-04-17, a property of a venue where 97.5% of quotes sit at a 1-tick spread, NOT a defect, and not smoothed away here: Phase 5/8 must choose the loss function and every IC/Sharpe statistic knowing the target has a ~44% point mass at zero. End-of-partition coverage loss without the D+1 tail is 507 rows (0.0074%; 1,086 = 0.0063% per L1 update), and 0 with it. Embargo >= 10s, asserted in CI (FEAT-04)."
version = 1
introduced = "2026-09-13"

[ret_1s_mid]
horizon = "1s"
computation = "(mid_{t+1s} - mid_t) / mid_t"
information_set = "data through t + 1s for the VALUE; quote ARRIVAL TIMES through t + 1s + label_gap.max_quote_gap_seconds decide whether it exists"
embargo = ">= 1s"
notes = "Diagnostic only -- do not train on this. mid_{t+h} is the PREVAILING mid -- the last L1 update with etime <= t+h (backward as-of, exact matches allowed; on a tie group the LAST update of that etime) -- never the first update after t+h. The next-quote convention disagrees on 0.206% of DECISION ROWS at h=10s (0.263% per L1 update; correlation 0.999907, measured 2026-09-13) and that delta is reported in the feature-tier DQ row (feature_asof_convention), not stored as a second column: an uncatalogued label column would break this catalogue's own rule. NULL -- never 0, never a carried-forward price -- when the horizon window ends past available data, spans an L1 gap longer than dq_thresholds.label_gap.max_quote_gap_seconds, or has no mid_t. Null-labelled rows are excluded from training by construction. Day D is built only once day D+1's curated manifest exists, so D's tail reads D+1's quotes and the most recent day is never built (partitions are write-once; a null tail could not be repointed). EVERY NUMBER BELOW IS PER DECISION ROW -- the row this label is actually written on. 04-RESEARCH-NOTES.md measured the same day per L1 UPDATE, a row set that oversamples busy milliseconds (2.5 quotes per distinct etime), so its returns have a higher std and fewer exact zeros; both are given because the research numbers are quoted elsewhere and the difference is large. Measured 2026-09-13 over 6,864,853 decision rows: std 4.761e-05, exactly zero on 80.8% of rows (per L1 update: 6.880e-05 and 62.5%). At four fifths zeros it is barely a continuous variable at all."
version = 1
introduced = "2026-09-13"

