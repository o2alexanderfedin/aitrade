notes = "Diagnostic only. mid_{t+h} is the PREVAILING mid -- the last L1 update with etime <= t+h (backward as-of, exact matches allowed; on a tie group the LAST update of that etime) -- never the first update after t+h. The next-quote convention disagrees on 0.26% of rows at h=10s (correlation 0.999907, measured 2026-09-13) and that delta is reported in the feature-tier DQ row (feature_asof_convention), not stored as a second column: an uncatalogued label column would break this catalogue's own rule. NULL -- never 0, never a carried-forward price -- when the horizon window ends past available data, spans an L1 gap longer than dq_thresholds.label_gap.max_quote_gap_seconds, or has no mid_t. Null-labelled rows are excluded from training by construction. Day D is built only once day D+1's curated manifest exists, so D's tail reads D+1's quotes and the most recent day is never built (partitions are write-once; a null tail could not be repointed). Measured 2026-09-13: std 9.53e-04, exactly zero on 0.2% of rows; end-of-partition coverage loss without the D+1 tail is 0.68% -- the largest of the four, and the reason the day-boundary rule exists."
