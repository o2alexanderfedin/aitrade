embargo = ">= 1s"
notes = "Diagnostic only -- do not train on this. mid_{t+h} is the PREVAILING mid -- the last L1 update with etime <= t+h (backward as-of, exact matches allowed; on a tie group the LAST update of that etime) -- never the first update after t+h. The next-quote convention disagrees on 0.206% of DECISION ROWS at h=10s (0.263% per L1 update; correlation 0.999907, measured 2026-09-13) and that delta is reported in the feature-tier DQ row (feature_asof_convention), not stored as a second column: an uncatalogued label column would break this catalogue's own rule. NULL -- never 0, never a carried-forward price -- when the horizon window ends past available data, spans an L1 gap longer than dq_thresholds.label_gap.max_quote_gap_seconds, has no mid_t, or -- null_stale, added 2026-09-19 -- had NO quote arrive in (t, t+h] at all, so the prevailing mid at t+h is the very quote that produced mid_t. THE STALENESS BOUND IS THE HORIZON, not a configured number (04-REVIEW.md WR-02): one absolute 30 s threshold is 3x this catalogue's primary horizon and 30x ret_1s_mid's, so any silence under it used to difference a carried-forward price against itself and report exactly 0.0 -- finite, unflagged, and indistinguishable from a real 'the market did not move'. A per-horizon absolute threshold was rejected for over-nulling the other way: a 5 s silence ending half a second inside a 1 s window leaves a genuine quote in that window. MEASURED on all three built days (22.29M decision rows): the rule nulls 69 primary labels (2026-09-12) and 180 ret_1s_mid (153 on 09-12, 27 on 09-13), 0 at 1 min and 0 at 10 min, and EVERY one of them was exactly 0.0 before. The measured statistics below are therefore unchanged to six significant figures (09-13 ret_10s_mid zero fraction moves by 0, ret_1s_mid by -7.6e-07); the existing partitions were NOT rewritten -- a rebuild under a new manifest is Phase 5's call. Null-labelled rows are excluded from training by construction. Day D is built only once day D+1's curated manifest exists, so D's tail reads D+1's quotes and the most recent day is never built (partitions are write-once; a null tail could not be repointed). EVERY NUMBER BELOW IS PER DECISION ROW -- the row this label is actually written on. 04-RESEARCH-NOTES.md measured the same day per L1 UPDATE, a row set that oversamples busy milliseconds (2.5 quotes per distinct etime), so its returns have a higher std and fewer exact zeros; both are given because the research numbers are quoted elsewhere and the difference is large. Measured 2026-09-13 over 6,864,853 decision rows: std 4.761e-05, exactly zero on 80.8% of rows (per L1 update: 6.880e-05 and 62.5%). At four fifths zeros it is barely a continuous variable at all."
version = 1
introduced = "2026-09-13"

