[project]
name = "mvp"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "mlflow-skinny==3.13.*",
    "numba==0.65.*",
    "numpy==2.4.*",
    "orjson==3.11.*",
    "polars==1.41.*",
    "scikit-learn==1.9.*",
    "sqlalchemy>=2.0.52",
    "websockets==16.*",
    "zstandard==0.25.*",
]

[dependency-groups]
dev = [
    "hypothesis==6.*",
    "pytest==9.*",
    "pytest-cov>=7.1.0",
    "ruff==0.15.*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# --import-mode=importlib (default is "prepend"): mvp/tests/sim/ has no
# __init__.py (D-06-02) and needs a test_kernel.py, but
# mvp/tests/features/test_kernel.py already exists, also without an
# __init__.py -- "prepend" mode identifies a test module by its bare
# basename absent a package marker, so the two collide
# ("import file mismatch", measured directly in this session). importlib
# mode identifies each module by its full file path instead, so same-named
# test files in different directories no longer need a package marker to
# stay distinct. Verified by running the full suite under this mode before
# adopting it (06-03-PLAN.md Task 1).
addopts = ["--import-mode=importlib"]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pandas".msg = "pandas is banned project-wide per CLAUDE.md; use polars"
