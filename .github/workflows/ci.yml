# Sanctioned exception to the mvp/ containment rule (Phase 2 Plan 04): this
# file must live at .github/workflows/ci.yml by GitHub Actions convention.
#
# Every `run:` step below uses the exact same command string as the
# corresponding hook's `entry:` in `.pre-commit-config.yaml` -- no per-step
# working directory override key anywhere, since every command already
# carries its own `--directory mvp` targeting. This is what makes the
# executed text byte-identical between the two callers.
#
# Two steps below are not `uv run` commands. The `shellcheck (tracked *.sh)`
# CHECK step runs `bash tools/check-shell-scripts.sh` -- still a repo-root
# relative path with no working-directory override, so it stays byte-identical
# to its `entry:`. The `install shellcheck` step before it has no pre-commit
# counterpart on purpose: it installs a tool instead of gating anything, and
# the byte-identity rule is about check steps.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"

      - name: uv sync
        run: uv sync --locked --directory mvp

      - name: ruff check
        run: uv run --locked --directory mvp ruff check .

      - name: ruff format --check
        run: uv run --locked --directory mvp ruff format --check .

      # shellcheck is a Haskell binary, so `mvp/uv.lock` cannot pin it and THIS
      # step is the pin. ubuntu-latest ships its own shellcheck at whatever
      # version the image happens to carry; `/usr/local/bin` precedes
      # `/usr/bin` on the runner PATH, so the pinned binary wins, and the
      # checker asserts the version it actually resolved -- a shadowed binary
      # fails loudly here instead of quietly reporting different findings than
      # pre-commit did.
      #
      # A pinned tag URL, never the moving `/releases/latest/` alias. The
      # sha256 is the digest GitHub's release API reports for this exact asset.
      # `set -euo pipefail` because the default `run:` shell has neither, and a
      # failed download would otherwise reach the checksum line as an empty
      # file.
      - name: install shellcheck 0.11.0 (pinned; not a check step)
        run: |
          set -euo pipefail
          url=https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl -fsSL --retry 3 -o /tmp/shellcheck.tar.xz "$url"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      # Byte-identical to the `shellcheck` hook's `entry:` in
      # `.pre-commit-config.yaml` -- see that hook's comment for the gap in the
      # parity test's parser.
      - name: shellcheck (tracked *.sh)
        run: bash tools/check-shell-scripts.sh

      - name: uv lock --check
        run: uv --directory mvp lock --check

      - name: check_pin_versions
        run: uv run --locked --directory mvp python -m tools.check_pin_versions

      - name: check_ms_to_ns_site
        run: uv run --locked --directory mvp python -m tools.check_ms_to_ns_site

      - name: check_catalogue_completeness
        run: uv run --locked --directory mvp python -m tools.check_catalogue_completeness

      - name: check_latest_ban
        run: uv run --locked --directory mvp python -m tools.check_latest_ban

      - name: check_lockbox_containment
        run: uv run --locked --directory mvp python -m tools.check_lockbox_containment

      - name: check_single_feature_path
        run: uv run --locked --directory mvp python -m tools.check_single_feature_path

      - name: check_numba_globals
        run: uv run --locked --directory mvp python -m tools.check_numba_globals

      - name: check_spec_diff
        run: uv run --locked --directory mvp python -m tools.check_spec_diff

      - name: check_no_manifest_rewrite --full
        run: uv run --locked --directory mvp python -m tools.check_no_manifest_rewrite --full

      - name: check_no_manifest_rewrite --full (CI fixture lake)
        run: uv run --locked --directory mvp python -m tools.check_no_manifest_rewrite --full --lake-root tests/fixtures/lake --registry-root tests/fixtures/lake_registry

      - name: check_manifest_id_integrity
        run: uv run --locked --directory mvp python -m tools.check_manifest_id_integrity

      # Needs full history (fetch-depth: 0 above); a shallow clone FAILS.
      - name: check_manifest_append_only
        run: uv run --locked --directory mvp python -m tools.check_manifest_append_only

      # D-05-15's static tripwire -- see the matching comment in
      # `.pre-commit-config.yaml`.
      - name: check_harness_accessor_only
        run: uv run --locked --directory mvp python -m tools.check_harness_accessor_only

      # FEAT-03's gate. Deliberately redundant with the full-suite step
      # below -- see the matching comment in `.pre-commit-config.yaml`.
      # A leakage proof with no name of its own in the CI log is a claim,
      # not a gate.
      - name: pytest (leakage suite)
        run: uv run --locked --directory mvp pytest tests/leakage -x -q

      - name: pytest (tests, via testpaths)
        run: uv run --locked --directory mvp pytest tests -x -q
